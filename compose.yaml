services:
  mysql:
    image: mysql:8.0
    container_name: siga-ucc-dev-mysql
    environment:
      MYSQL_DATABASE: siga_ucc
      MYSQL_USER: siga
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD locally}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD locally}
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3307}:3306"
    volumes:
      - siga-ucc-dev-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  siga-ucc-dev-mysql-data:
    name: siga-ucc-dev-mysql-data

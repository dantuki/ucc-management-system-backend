services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: siga_ucc
      MYSQL_USER: siga
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD locally}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD locally}
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10

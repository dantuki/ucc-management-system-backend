name: CI

on:
  pull_request:
  push:
    branches: [ main, codex/siga-ucc-backend-modernization ]

permissions:
  contents: read

jobs:
  build-and-unit-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet restore WebApi/WebApi.sln
      - run: dotnet build WebApi/WebApi.sln --configuration Release --no-restore
      - run: dotnet test WebApi/WebApi.sln --configuration Release --no-build
      - run: dotnet list WebApi/WebApi.sln package --vulnerable --include-transitive
